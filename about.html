<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Sofa Space Interiors</title>

  <style>
    body {
      position: relative;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url("ssi.jpg") center/cover no-repeat;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    /* Navigation */
    nav {
      background: rgba(0,0,0,0.8);
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #FFD700; /* gold hover */
    }

    /* About Content */
    .about-container {
      max-width: 800px;
      margin: 50px auto;
      text-align: center;
      padding: 20px;
    }

    .about-container h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .about-container p {
      font-size: 1.2rem;
      line-height: 1.8;
    }

    /* Founder Section */
    .founder-section {
      margin-top: 40px;
    }

    .founder-pic {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 15px;
    }

    .founder-section h2 {
      margin: 10px 0 5px;
      font-size: 1.8rem;
    }

    .founder-section p {
      font-size: 1.1rem;
      color: #ddd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- ?? Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="services.html">Services</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- About Content -->
  <div class="about-container">
    <h1>About Us</h1>
    <p>
      Sofa Space Interiors is committed to transforming houses into dream homes. 
      We specialize in Living Room Design, Modular Kitchens, Gaming Interiors, 
      False Ceilings, Lighting, and Customized Sofas.
    </p>

    <div class="founder-section">
      <img src="founder.jpg" alt="Founder - Samuel Gadkar" class="founder-pic">
      <h2>Samuel Gadkar</h2>
      <p>Founder of Sofa Space Interiors</p>
    </div>
  </div>

</body>
</html>
